<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WebView2 host probe</title>
<!--
  探针页面。它只有一个目的：让宿主侧的量测有真实可测的内容。

  查询参数：
    ?blocks=2000     生成多少个内容块（默认 2000，对齐 README 12.1.1 的同屏规模）
    ?diagrams=0      渲染多少张 Mermaid 图（需要同目录存在 mermaid.min.js）

  mermaid.min.js 是【可选】的：不存在时页面照常工作并记录 __mermaidState。
  如需连图一起测，把 mermaid.min.js 放到本文件同目录。

  注意：mermaid.min.js 是阻塞式 <script>，所以它的下载与解析时间会被计入
  宿主的 NavigationCompleted —— 这正是我们要量的"冷态"成本。
-->
<script src="mermaid.min.js" onerror="window.__mermaidState='missing'"></script>
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; line-height: 1.6; }
  #stage { padding: 16px; }
  .blk { margin: 0 0 12px 0; }
  pre { background: #f5f5f5; padding: 8px; overflow: auto; }
  table { border-collapse: collapse; }
  td, th { border: 1px solid #ddd; padding: 4px 8px; }
</style>
</head>
<body>
<div id="stage"></div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var blocks = parseInt(params.get("blocks") || "2000", 10);
  var diagrams = parseInt(params.get("diagrams") || "0", 10);

  var stage = document.getElementById("stage");
  var html = [];

  // 与真实笔记库规模对齐的内容：标题、段落、列表、代码、表格混合。
  for (var i = 0; i < blocks; i++) {
    var kind = i % 5;
    if (kind === 0) {
      html.push('<h2 class="blk">小节 ' + i + ' Section ' + i + '</h2>');
    } else if (kind === 1) {
      html.push('<p class="blk">这是第 ' + i + ' 段正文，用于测量排版耗时。' +
        'Contains <b>bold</b>, <i>italic</i>, <code>code</code> and a ' +
        '<a href="https://example.com/' + i + '">link</a>.</p>');
    } else if (kind === 2) {
      html.push('<ul class="blk"><li>列表项 A ' + i + '</li>' +
        '<li>列表项 B ' + i + '</li><li>列表项 C ' + i + '</li></ul>');
    } else if (kind === 3) {
      html.push('<pre class="blk"><code>int value_' + i + ' = ' + i + ';</code></pre>');
    } else {
      html.push('<table class="blk"><tr><th>列 A</th><th>列 B</th></tr>' +
        '<tr><td>' + i + '</td><td>' + (i * 2) + '</td></tr></table>');
    }
  }
  stage.innerHTML = html.join("");

  window.__probe = {
    blocks: blocks,
    diagramsRequested: diagrams,
    docHeight: document.body.scrollHeight,
    mermaidState: (typeof mermaid === "undefined") ? "missing" : "present"
  };

  if (typeof mermaid === "undefined" || diagrams <= 0) {
    return;
  }

  var srcs = [
    'flowchart TD\n A["获取机器详情 Fetch machine details"] --> B{"配置已知?"}\n B -->|是| C["应用模块"]\n B -->|否| D["中止构建"]\n C --> E["运行安装后钩子"]',
    'sequenceDiagram\n participant H as 宿主 Steward\n participant T as 工具 Loomery\n H->>T: context.update\n T-->>H: ready\n T-->>H: heartbeat\n H->>T: shutdown',
    'classDiagram\n class Module {\n +String name\n +apply()\n }\n class PostInstall {\n +run()\n }\n Module <|-- PostInstall'
  ];

  var host = document.createElement("div");
  host.id = "diagrams";
  stage.appendChild(host);

  try {
    mermaid.initialize({ startOnLoad: false, theme: "default" });
    var pending = [];
    for (var d = 0; d < diagrams; d++) {
      var id = "probe_diagram_" + d;
      pending.push(
        mermaid.render(id, srcs[d % srcs.length]).then(function (result) {
          var box = document.createElement("div");
          box.className = "blk";
          box.innerHTML = result.svg;
          host.appendChild(box);
        })
      );
    }
    Promise.all(pending).then(function () {
      window.__probe.diagramsRendered = diagrams;
    }).catch(function (err) {
      window.__probe.diagramError = String(err);
    });
  } catch (err) {
    window.__probe.diagramError = String(err);
  }
})();
</script>
</body>
</html>
