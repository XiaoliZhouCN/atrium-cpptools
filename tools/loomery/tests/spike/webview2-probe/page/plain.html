<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>plain probe</title>
<!--
  极简探针页：**不含任何外部子资源**（没有 <script src>、没有 <link>、没有 <img>）。

  用途：区分"渲染真实 HTML 这一步坏了"与"某个外部子资源请求挂住了"。
  probe.html 带一个 file:// 的 <script src>，本页不带。两者的差异只在这里。

  查询参数与 probe.html 一致（?blocks= / ?diagrams=），但 diagrams 恒为 0。
-->
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  #stage { padding: 16px; }
  .blk { margin: 0 0 12px 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function () {
  var queryStr = (typeof window.__probeQuery === "string") ? window.__probeQuery : location.search;
  var params = new URLSearchParams(queryStr);
  var blocks = parseInt(params.get("blocks") || "2000", 10);

  var stage = document.getElementById("stage");
  var html = [];
  for (var i = 0; i < blocks; i++) {
    html.push('<p class="blk">plain block ' + i + ' 纯内联内容，无任何外部子资源。</p>');
  }
  stage.innerHTML = html.join("");

  window.__probe = {
    page: "plain",
    blocks: blocks,
    docHeight: document.body.scrollHeight,
    externalSubresources: 0
  };
})();
</script>
</body>
</html>
